<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Gold Price Drop Notifier</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="app">
        <header class="app-header">
            <img src="logo48x48.png" alt="" class="app-logo">
            <div>
                <h1 class="app-title">Gold Price Drop Notifier</h1>
                <p class="app-subtitle">India's IBJA benchmark rate</p>
            </div>
        </header>

        <main>
            <div class="segmented" role="radiogroup" aria-label="Gold purity">
                <input type="radio" name="purity" id="purity-24K" value="24K" checked>
                <label for="purity-24K">24K <span>999</span></label>
                <input type="radio" name="purity" id="purity-22K" value="22K">
                <label for="purity-22K">22K <span>916</span></label>
            </div>

            <p id="error-banner" class="banner" role="alert" hidden></p>

            <section class="rate-card" aria-live="polite">
                <div class="rate-card-top">
                    <span id="rate-label" class="eyebrow">24K gold · per 10 g</span>
                    <span id="rate-session" class="pill" hidden></span>
                </div>
                <div id="rate-loading" class="skeleton" role="status" aria-label="Loading the gold rate"></div>
                <p id="rate-value" class="rate-value" hidden></p>
                <p id="rate-meta" class="rate-meta"></p>
                <p id="target-diff" class="target-diff" hidden></p>
            </section>

            <form id="rate-form" class="alert-form">
                <label for="user-input" id="user-input-label" class="field-label">Alert me when 24K drops below</label>
                <div class="field-row">
                    <div class="input-wrap">
                        <span class="input-prefix" aria-hidden="true">₹</span>
                        <input type="number" id="user-input" min="1" step="1" inputmode="numeric" placeholder="e.g. 150000" required>
                    </div>
                    <button id="submit" type="submit" class="btn-primary">Set alert</button>
                </div>
                <p id="target-hint" class="hint"></p>
            </form>
        </main>

        <footer class="app-footer">
            <span>Per 10 g, excl. GST</span>
            <a href="https://ibjarates.com/" target="_blank" rel="noopener">ibjarates.com ↗</a>
        </footer>
    </div>

    <script src="format.js"></script>
    <script src="popup.js"></script>
</body>

</html>
