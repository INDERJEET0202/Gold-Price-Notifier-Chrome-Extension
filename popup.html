<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Gold Rates Extension</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
</head>

<body>
    <header>
        <div class="header">
            <h1>Time to buy gold</h1>
        </div>
    </header>

    <div class="container">
        <div class="row">
            <form id="rate-form" class="col-xs-6">
                <div class="d-flex justify-content-center">
                    <label for="user-input">Your 24K gold rate (₹/10g):</label>
                </div>
                <input type="number" id="user-input" min="1" step="1" required>
                <div class="d-grid gap-2 col-6 mx-auto py-2">
                    <button id="submit" class="btn btn-success" type="submit">Submit Rate</button>
                </div>
            </form>
            <div class="col-xs-6">
                <div class="text-center">
                    <div id="loading" class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p id="price"></p>
                    <p id="price-status" class="small text-muted"></p>
                    <p id="price2"></p>
                </div>
            </div>
            <div class="d-grid col-10 mx-auto py-2">
                <a href="https://ibjarates.com/" target="_blank" class="btn btn-primary">Check Gold rates online</a>
            </div>
        </div>
    </div>


    <footer>
        <p>&copy; 2023 Gold Rates Extension</p>
    </footer>

    <script src="format.js"></script>
    <script src="popup.js"></script>

</body>

</html>
