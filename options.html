<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Gold Price Drop Notifier Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <style>
        body { min-width: 360px; padding: 16px; }
        [hidden] { display: none !important; }
    </style>
</head>

<body>
    <form id="settings-form">
        <label for="api-key" class="form-label">metalpriceapi.com API key</label>
        <input type="text" id="api-key" class="form-control" autocomplete="off" spellcheck="false" required>
        <p class="form-text">
            Get a free key at <a href="https://metalpriceapi.com" target="_blank">metalpriceapi.com</a>.
            It is stored only in this browser and is used once a day to fetch the gold rate.
        </p>
        <button type="submit" class="btn btn-success">Save</button>
        <p id="status" class="mt-3" role="status"></p>
    </form>

    <script src="format.js"></script>
    <script src="options.js"></script>
</body>

</html>
