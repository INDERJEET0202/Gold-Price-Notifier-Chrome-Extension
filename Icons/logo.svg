<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Gold Price Drop Notifier icon: a gold rupee coin with a green "price down" badge.
       Everything is drawn with shapes (no fonts), so it renders the same everywhere.
       Rendered to the PNG icons by `npm run icons` (scripts/render-icons.js). -->
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#f5b82e"/>
      <stop offset="1" stop-color="#c2700c"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#e09a1a"/>
    </linearGradient>
  </defs>

  <!-- Coin: rim, face and an inner ring. -->
  <circle cx="58" cy="58" r="54" fill="url(#coin)"/>
  <circle cx="58" cy="58" r="54" fill="none" stroke="#92400e" stroke-width="4"/>
  <circle cx="58" cy="58" r="42" fill="url(#face)"/>
  <circle cx="58" cy="58" r="42" fill="none" stroke="#fff3c4" stroke-opacity="0.7" stroke-width="3"/>

  <!-- Rupee sign: two bars, the bowl, and the diagonal leg. -->
  <g fill="none" stroke="#7c2d12" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 30 H78"/>
    <path d="M40 46 H78"/>
    <path d="M40 30 H52 C63 30 69 37 69 46 C69 55 62 62 51 62 H42 L70 88"/>
  </g>

  <!-- "Price down" badge. -->
  <circle cx="100" cy="100" r="26" fill="#15803d" stroke="#ffffff" stroke-width="5"/>
  <path d="M100 86 V112 M89 101 L100 112 L111 101" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
